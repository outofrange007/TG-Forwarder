# Portainer stack (Repository). Set the variables below under
# "Environment variables" in Portainer - no .env file is needed.
services:
  # Shared database: all forwarder instances use this one history
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forwarder
      POSTGRES_PASSWORD: ${PG_PASSWORD}   # set under "Environment variables" in Portainer
      POSTGRES_DB: forwarder
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistent database storage

  telegram-forwarder:
    image: ghcr.io/outofrange007/tg-forwarder:latest
    container_name: telegram_forwarder
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - DATA_PATH=/app/data
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5020
      # --- required ---
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - SOURCE_CHAT=${SOURCE_CHAT:-}
      - TARGET_CHAT=${TARGET_CHAT:-}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      # --- optional (defaults as in .env.example) ---
      - SESSION_STRING=${SESSION_STRING:-}
      - SOURCE_TOPIC_ID=${SOURCE_TOPIC_ID:-}
      - TOPIC_MODE=${TOPIC_MODE:-none}
      - TARGET_TOPIC_ID=${TARGET_TOPIC_ID:-}
      - MODE=${MODE:-copy}
      - HIDE_SENDER=${HIDE_SENDER:-true}
      - MEDIA_TYPES=${MEDIA_TYPES:-photo,video,image_file,video_file}
      - COPY_TEXT=${COPY_TEXT:-false}
      - DELAY_SECONDS=${DELAY_SECONDS:-2}
      - DOWNLOAD_FALLBACK=${DOWNLOAD_FALLBACK:-true}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-2000}
      - RESUME=${RESUME:-true}
      - DRY_RUN=${DRY_RUN:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://forwarder:${PG_PASSWORD}@postgres:5432/forwarder
    depends_on:
      - postgres   # start the database first
    
    ports:
      - "5020:5000"
    volumes:
      - /home/TG-Forwarder/forwarder/data:/app/data
      pgdata:
    # Without the dashboard, for continuous operation (run "login" once beforehand):
    # command: ["python", "-m", "forwarder", "run", "--live"]
